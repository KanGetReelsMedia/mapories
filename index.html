
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapories | The Living Thread</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"> 

    <style>
        :root {
            --bg-dark: #050811;
            --glass: rgba(255, 255, 255, 0.05);
            --accent-blue: #4A90E2;
            --accent-pink: #FF69B4;
            --glow: rgba(74, 144, 226, 0.3);
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Pink Grid Background */
        .pink-grid-overlay {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none; z-index: -10;
            opacity: 0.15;
            background-image: 
                linear-gradient(rgba(255, 105, 180, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 105, 180, 0.3) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Modal & UI Elements */
        .modal {
            background: rgba(13, 20, 38, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 20px var(--glow);
            width: 90%; max-width: 400px;
            margin: 50px auto;
        }

        input, textarea {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; padding: 15px; border-radius: 12px;
            width: 100%; margin-bottom: 15px; box-sizing: border-box;
        }

        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .btn {
            padding: 15px; border: none; border-radius: 12px;
            font-weight: 700; text-transform: uppercase;
            cursor: pointer; transition: 0.3s; color: white;
        }
        .btn-save { background: var(--accent-blue); }
        .btn-share { background: var(--accent-pink); }
        .btn-delete { background: #8B0000; }

        #previewContainer { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        #previewContainer img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }

        .vault-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; padding: 20px; }
        .vault-item { 
            aspect-ratio: 1/1; border-radius: 16px; overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.1); transition: 0.3s;
        }
        .vault-item:hover { border-color: var(--accent-pink); box-shadow: 0 0 15px var(--accent-pink); }
    </style>
</head>
<body>

    <div class="pink-grid-overlay"></div>

    <section class="photo-vault-container">
        <h2 style="padding: 20px;">Captured Moments</h2>
        <div class="vault-grid" id="photoVaultGrid"></div>
    </section>

    <div class="modal" id="addModal">
        <h2 class="blue-glow">New Memory</h2>
        <input type="text" id="mTitle" placeholder="Memory Title">
        <textarea id="mNote" placeholder="Describe the moment..." rows="3"></textarea>
        
        <label class="btn" style="background: #333; display: block; text-align: center;" for="mPhoto">
            ADD PHOTOS
        </label>
        <input type="file" id="mPhoto" accept="image/*" multiple onchange="handleFiles(event)" style="display:none;">
        <div id="previewContainer"></div>
        
        <div class="btn-group">
            <button class="btn btn-save" onclick="handleSave()">COMMIT TO MEMORY</button>
            <button class="btn btn-share" onclick="shareMemory()">SHARE TO SOCIAL</button>
            <button class="btn btn-delete" onclick="deleteMemory()">DELETE ENTRY</button>
        </div>
    </div>

    <script>
        let stagedPhotos = [];

        function handleFiles(event) {
            const files = event.target.files;
            const container = document.getElementById('previewContainer');
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    stagedPhotos.push(e.target.result);
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    container.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }

        function shareMemory() {
            if (navigator.share) {
                navigator.share({
                    title: document.getElementById('mTitle').value || 'My Mapory',
                    text: 'Reliving a moment on Mapories.',
                    url: window.location.href
                }).catch(console.error);
            } else {
                alert("Sharing not supported.");
            }
        }

        function deleteMemory() {
            if (confirm("Discard this memory permanently?")) {
                stagedPhotos = [];
                document.getElementById('previewContainer').innerHTML = '';
                alert("Entry cleared.");
            }
        }

        function handleSave() {
            alert("Memory Committed.");
            <script>
    let memories = JSON.parse(localStorage.getItem('mapories_data')) || [];
    let stagedPhotos = [];

    // Initialize: Load memories on startup
    window.onload = renderVault;

    function handleFiles(event) {
        const files = event.target.files;
        const container = document.getElementById('previewContainer');
        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                stagedPhotos.push(e.target.result);
                const img = document.createElement('img');
                img.src = e.target.result;
                container.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    }

    function handleSave() {
        const newMemory = {
            id: Date.now(),
            title: document.getElementById('mTitle').value || "Untitled Memory",
            note: document.getElementById('mNote').value,
            photos: stagedPhotos
        };
        
        memories.push(newMemory);
        localStorage.setItem('mapories_data', JSON.stringify(memories));
        
        // Reset UI
        stagedPhotos = [];
        document.getElementById('previewContainer').innerHTML = '';
        document.getElementById('mTitle').value = '';
        document.getElementById('mNote').value = '';
        
        renderVault();
    }

    function renderVault() {
        const grid = document.getElementById('photoVaultGrid');
        grid.innerHTML = memories.map(m => `
            <div class="vault-item">
                <img src="${m.photos[0] || 'https://via.placeholder.com/150'}" alt="${m.title}">
                <div style="padding: 10px; font-size: 0.8rem;">${m.title}</div>
            </div>
        `).join('');
    }

    function deleteMemory() {
        if (confirm("Discard this memory permanently?")) {
            memories = []; // Clears the array
            localStorage.removeItem('mapories_data');
            renderVault();
            alert("All memory threads cleared.");
        }
    }

    function shareMemory() {
        if (navigator.share) {
            navigator.share({ title: 'Mapories', text: 'Check out my memories!', url: window.location.href });
        }
    }
</script>)
        }
    </script>
</body>
</html>
