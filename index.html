<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapories | Capture the Past</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-blue: #0A4D8C;
            --brand-dark: #050811;
            --card-bg: #0D1426;
            --pure-white: #FFFFFF;
            --text-dim: #9FAEC2;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--brand-dark);
            color: var(--pure-white);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            max-width: 500px;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, #4A90E2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-dim);
            font-weight: 300;
            margin: 5px 0 0;
        }

        .main-layout {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Memory Creator Form */
        .memory-form {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4A90E2;
        }

        input[type="text"], textarea {
            background: rgba(5, 8, 17, 0.6);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            color: var(--pure-white);
            font-family: inherit;
            font-size: 1rem;
            transition: 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #4A90E2;
            box-shadow: 0 0 10px rgba(74, 144, 226, 0.2);
        }

        /* File Upload Styling */
        .file-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
        }

        .file-input-wrapper:hover {
            border-color: #4A90E2;
            background: rgba(74, 144, 226, 0.02);
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0; top: 0; opacity: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }

        .preview-box {
            display: none;
            width: 100%;
            height: 180px;
            border-radius: 10px;
            object-fit: cover;
            margin-top: 10px;
        }

        .btn {
            width: 100%;
            background: var(--pure-white);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #e6e6e6;
            transform: translateY(-2px);
        }

        /* Saved Memories Feed */
        .feed-title {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin: 10px 0 0;
        }

        .memory-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .memory-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid var(--border);
        }

        .memory-body {
            padding: 20px;
        }

        .memory-body h3 {
            margin: 0 0 5px 0;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .memory-location {
            font-size: 0.85rem;
            color: #4A90E2;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .memory-desc {
            color: var(--text-dim);
            font-weight: 300;
            margin: 0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mapories</h1>
        <p>Your Geolocation Nostalgia Archive</p>
    </header>

    <div class="main-layout">
        <!-- Input Form Component -->
        <section class="memory-form">
            <form id="memoryForm">
                <div class="form-group">
                    <label for="title">Memory Title</label>
                    <input type="text" id="title" placeholder="e.g., The Old Blockbuster" required>
                </div>
                <div class="form-group">
                    <label for="location">Location Name / Coordinates</label>
                    <input type="text" id="location" placeholder="e.g., Main St & 5th Ave" required>
                </div>
                <div class="form-group">
                    <label for="description">The Story</label>
                    <textarea id="description" rows="3" placeholder="What happened here that made it memorable?" required></textarea>
                </div>
                <div class="form-group">
                    <label>Capture Image</label>
                    <div class="file-input-wrapper">
                        <span id="uploadPrompt">Tap to Upload or Take a Photo</span>
                        <input type="file" id="photoInput" accept="image/*">
                    </div>
                    <img id="imagePreview" class="preview-box" alt="Preview">
                </div>
                <button type="submit" class="btn">Log to Archive</button>
            </form>
        </section>

        <!-- Dynamic Feed List -->
        <div class="feed-title">Saved Archives</div>
        <div id="memoryFeed" style="display: flex; flex-direction: column; gap: 20px;"></div>
    </div>

    <script>
        const memoryForm = document.getElementById('memoryForm');
        const photoInput = document.getElementById('photoInput');
        const imagePreview = document.getElementById('imagePreview');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const memoryFeed = document.getElementById('memoryFeed');

        let base64Image = "";

        // Read Photo Stream and convert to Base64 for LocalStorage caching
        photoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    base64Image = event.target.result;
                    imagePreview.src = base64Image;
                    imagePreview.style.display = 'block';
                    uploadPrompt.innerText = "Photo Staged Successfully";
                };
                reader.readAsDataURL(file);
            }
        });

        // Form Submit Action
        memoryForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const newMemory = {
                id: Date.now(),
                title: document.getElementById('title').value,
                location: document.getElementById('location').value,
                description: document.getElementById('description').value,
                image: base64Image || 'https://via.placeholder.com/500x300?text=No+Photo+Captured'
            };

            // Grab existing arrays, push new data, save back to browser cache
            let archives = JSON.parse(localStorage.getItem('mapories_data')) || [];
            archives.unshift(newMemory);
            localStorage.setItem('mapories_data', JSON.stringify(archives));

            // Reset inputs
            memoryForm.reset();
            imagePreview.style.display = 'none';
            uploadPrompt.innerText = "Tap to Upload or Take a Photo";
            base64Image = "";

            renderFeed();
        });

        // Render Cards inside Feed Layout
        function renderFeed() {
            memoryFeed.innerHTML = "";
            const archives = JSON.parse(localStorage.getItem('mapories_data')) || [];

            if (archives.length === 0) {
                memoryFeed.innerHTML = `<div style="text-align:center; color: var(--text-dim); font-weight:300; padding: 20px;">No memory markers mapped yet.</div>`;
                return;
            }

            archives.forEach(item => {
                const card = document.createElement('div');
                card.className = 'memory-card';
                card.innerHTML = `
                    <img src="${item.image}" class="memory-img" alt="${item.title}">
                    <div class="memory-body">
                        <h3>${item.title}</h3>
                        <div class="memory-location">📍 ${item.location}</div>
                        <p class="memory-desc">${item.description}</p>
                    </div>
                `;
                memoryFeed.appendChild(card);
            });
        }

        // Run render sequence on app launch
        renderFeed();
    </script>
</body>
</html>
