<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapories | The Living Thread</title>

    <!-- PWA Manifest Integration -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A4D8C">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"> 

    <!-- External Stylesheet Links -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* CSS Extension for the Photo Vault Grid */
        .photo-vault-container {
            width: 100%;
            max-width: 1200px;
            margin: 40px auto 120px;
            padding: 0 20px;
        }

        .vault-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .vault-header h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #4A90E2;
            margin: 0;
            font-weight: 700;
        }

        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .vault-item {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(13, 20, 38, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1), border-color 0.3s;
        }

        .vault-item:hover {
            transform: scale(1.04);
            border-color: #4A90E2;
        }

        .vault-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .vault-caption {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(5, 8, 17, 0.9));
            padding: 10px;
            font-size: 0.75rem;
            color: #FFFFFF;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 300;
        }

        @media (max-width: 600px) {
            .vault-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- PWA IMMERSIVE LOADING SCREEN -->
    <div id="loading-screen">
        <div class="loading-content">
            <h1 class="loading-logo">Mapories</h1>
            <div class="loading-bar-container">
                <div class="loading-bar-progress"></div>
            </div>
            <div class="loading-status">INITIALIZING DATA THREAD...</div>
        </div>
    </div>

    <!-- Background Grid & Effects -->
    <div id="grid-container"></div>
    <div class="vignette"></div>

    <!-- Top UI Elements -->
    <header id="main-header">
        <h1 class="logo-text">Mapories</h1>
    </header>

    <div class="top-controls" id="top-ui">
        <button class="relive-btn" onclick="openReliveSearch()">
            <span class="material-icons">auto_awesome</span> RELIVE
        </button>
    </div>

    <!-- Playback View Overlay -->
    <div id="playback-ui">
        <div id="pb-date"></div>
        <div class="playback-subtitle">REPLAYING DATA THREAD</div>
    </div>

    <!-- Timeline Workspace -->
    <div id="timeline-viewport">
        <div class="memory-track" id="memory-track">
            <svg id="thread-layer"></svg>
        </div>
    </div>

    <!-- NEW: PHOTO VAULT GALLERY SECTION -->
    <section class="photo-vault-container">
        <div class="vault-header">
            <span class="material-icons" style="color: #4A90E2;">collections</span>
            <h2>Captured Moments</h2>
        </div>
        <div class="vault-grid" id="photoVaultGrid">
            <!-- Dynamic JavaScript injects base64/uploaded layout blocks here -->
            <div class="vault-item">
                <img src="https://via.placeholder.com/300?text=No+Photos" alt="Placeholder">
                <div class="vault-caption">No moments captured yet</div>
            </div>
        </div>
    </section>

    <!-- Bottom Action Controls -->
    <div class="controls" id="bottom-ui">
        <div id="year-display" class="year-pill">2026</div>
        <button class="add-btn" onclick="openModal()">
            <span class="material-icons" style="font-size: 2rem;">add</span>
        </button>
    </div>

    <!-- Modal: Add New Entry -->
    <div class="overlay" id="addModal">
        <div class="modal">
            <h2 class="modal-title blue-glow">New Entry</h2>
            <input type="text" id="mTitle" placeholder="Memory Title">
            <textarea id="mNote" placeholder="Describe the moment..." rows="3"></textarea>
            
            <div class="form-row">
                <input type="date" id="mDate">
                <input type="time" id="mTime">
            </div>
            
            <div class="form-row">
                <input type="text" id="mLoc" placeholder="Location" style="flex:2">
                <select id="mWeather" style="flex:1">
                    <option value="wb_sunny">Sunny</option>
                    <option value="cloudy">Cloudy</option>
                    <option value="rainy">Rainy</option>
                    <option value="ac_unit">Chilly</option>
                    <option value="nightlight">Night</option>
                </select>
            </div>

            <!-- Integrated Photo Upload Block -->
            <div class="form-row photo-upload-row">
                <label class="photo-capture-label" for="mPhoto">
                    <span class="material-icons">photo_camera</span> Capture Image
                </label>
                <input type="file" id="mPhoto" accept="image/*" onchange="previewImage(event)">
                <img id="modalPreview" src="#" alt="Thumbnail Preview" style="display: none; max-height: 80px; border-radius: 8px; margin-top: 5px;">
            </div>
            
            <button class="save-btn commit-btn" onclick="handleSave()">COMMIT TO MEMORY</button>
            <button class="discard-btn" onclick="closeModal()">DISCARD DATA</button>
        </div>
    </div>

    <!-- Modal: Relive Playback Hub -->
    <div class="overlay" id="reliveModal">
        <div class="modal" style="border-color: var(--brand-blue, #0A4D8C);">
            <h2 class="modal-title blue-glow">Relive Hub</h2>
            <p class="modal-description">Select a date to scroll through its moments.</p>
            <input type="date" id="reliveDate" style="border-color: #222;">
            <button class="save-btn playback-btn" onclick="startRelive()">INITIATE PLAYBACK</button>
            <button class="discard-btn" onclick="document.getElementById('reliveModal').style.display='none'">EXIT</button>
        </div>
    </div>

    <!-- External Logic Script -->
    <script src="app.js"></script>

    <!-- PWA Background Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered safely.', reg))
                    .catch(err => console.log('Service Worker registration failed: ', err));
            });
        }

        // Global base64 storage hook for app.js integration
        let currentStagedPhoto = "";

        function previewImage(event) {
            const preview = document.getElementById('modalPreview');
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentStagedPhoto = e.target.result;
                    preview.src = currentStagedPhoto;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        // Front-end UI display utility function for photo grid injection
        function updatePhotoVaultUI(memoriesArray) {
            const vaultGrid = document.getElementById('photoVaultGrid');
            const photoMemories = memoriesArray.filter(m => m.image && m.image !== "");
            
            if (photoMemories.length === 0) {
                vaultGrid.innerHTML = `
                    <div class="vault-item" style="grid-column: 1/-1; aspect-ratio: auto; padding: 30px; text-align: center; color: #415370;">
                        No moments captured yet.
                    </div>`;
                return;
            }

            vaultGrid.innerHTML = photoMemories.map(item => `
                <div class="vault-item" onclick="focusTimelineNode('${item.id}')">
                    <img src="${item.image}" alt="${item.title}">
                    <div class="vault-caption">${item.title}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
